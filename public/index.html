<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping / Pong</title>
  <meta name="description" content="Turn-based realtime rally. Share a link or QR, alternate ping and pong." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/style.css" />
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- ── SCREEN 1: ONBOARDING ─────────────────────────────────────── -->
<div id="screenOnboard" class="screen active">
  <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">☾</button>
  <div class="onboard-wrap">
    <div class="logo-mark" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <rect x="6" y="10" width="10" height="36" rx="5" fill="currentColor"/>
        <rect x="40" y="10" width="10" height="36" rx="5" fill="currentColor"/>
        <circle cx="28" cy="28" r="6" fill="currentColor"/>
        <circle cx="28" cy="28" r="10" stroke="currentColor" stroke-width="2" fill="none" opacity="0.3"/>
      </svg>
    </div>
    <h1 class="onboard-title">Ping&thinsp;/&thinsp;Pong</h1>
    <p class="onboard-sub">Two players. One link. Live rally.</p>

    <div class="onboard-card" id="cardName">
      <label class="onboard-label" for="obName">Your name</label>
      <input id="obName" class="onboard-input" placeholder="Khalid" maxlength="24" autocomplete="off" />
      <div class="field-error" id="obNameError"></div>
      <div class="emoji-row" id="obEmojiGrid"></div>
      <input type="hidden" id="obEmoji" value="🏓" />
      <button class="btn-hero" id="obStartBtn">Start game →</button>
    </div>
  </div>
</div>

<!-- ── SCREEN 2: SHARE / WAITING ───────────────────────────────── -->
<div id="screenShare" class="screen">
  <button class="theme-toggle" id="themeToggle2" aria-label="Switch theme">☾</button>
  <div class="share-wrap">
    <div class="share-header">
      <span class="share-you" id="shareYouLabel"></span>
      <span class="share-hint">Waiting for opponent…</span>
    </div>
    <div class="qr-box" id="qrBox"></div>
    <p class="share-url" id="shareUrl"></p>
    <div class="share-actions">
      <button class="btn-action" id="shareCopyBtn">Copy link</button>
      <button class="btn-action ghost" id="shareNotifyBtn">🔔 Notify me</button>
    </div>
    <p class="share-note">Share the QR or link. They scan → enter name → play.</p>
    <div class="waiting-dots" aria-label="Waiting"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- ── SCREEN 3: GAME ───────────────────────────────────────────── -->
<div id="screenGame" class="screen">
  <header class="game-header">
    <div class="game-brand">
      <svg width="24" height="24" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <rect x="6" y="10" width="10" height="36" rx="5" fill="currentColor"/>
        <rect x="40" y="10" width="10" height="36" rx="5" fill="currentColor"/>
        <circle cx="28" cy="28" r="6" fill="currentColor"/>
      </svg>
      <span>Ping / Pong</span>
    </div>
    <div class="game-badges">
      <span class="badge-pill turn" id="turnBadge">Next: ping</span>
      <span class="badge-pill sync" id="syncBadge">○ Connecting</span>
    </div>
    <button class="theme-toggle small" id="themeToggle3" aria-label="Switch theme">☾</button>
  </header>

  <div class="game-body">
    <!-- Arena -->
    <section class="arena-wrap">
      <div class="arena" id="arena" aria-label="Ping pong court" role="img">
        <div class="court-line"></div>
        <div class="paddle paddle-left" id="paddleLeft"></div>
        <div class="paddle paddle-right" id="paddleRight"></div>
        <div class="ball" id="ball"></div>
        <div class="impact-ring" id="impactRing"></div>
        <div class="arena-overlay">
          <div class="player-tag left" id="tagLeft"><span class="tag-emoji"></span><span class="tag-name">—</span></div>
          <div class="turn-center" id="turnCenter">🏓</div>
          <div class="player-tag right" id="tagRight"><span class="tag-emoji"></span><span class="tag-name">—</span></div>
        </div>
      </div>
      <p class="turn-text" id="turnText">Waiting for players…</p>
    </section>

    <!-- Composer + Feed -->
    <section class="side-panel">
      <div class="composer-card">
        <div class="composer-top">
          <span class="my-badge" id="myBadge"></span>
          <span class="char-count" id="charCount">0 / 280</span>
        </div>
        <textarea id="messageInput" class="composer-input" placeholder="Attach a note, link, or song… (optional)" maxlength="280" rows="3"></textarea>
        <div class="field-error" id="composerError"></div>
        <div class="composer-actions">
          <button class="btn-send" id="sendBtn">Send</button>
          <button class="btn-ghost-sm" id="resetRoomBtn">Reset room</button>
          <button class="btn-ghost-sm" id="shareAgainBtn">Share QR</button>
        </div>
        <div class="composer-hint">⌘↵ to send · First move is always <strong>ping</strong></div>
      </div>

      <div class="feed-card">
        <div class="feed-header">Rally feed</div>
        <div class="feed" id="feed"></div>
      </div>
    </section>
  </div>

  <!-- Reconnect banner -->
  <div class="reconnect-banner hidden" id="reconnectBanner" role="alert">
    <span id="reconnectMsg">Connection lost…</span>
    <button class="btn-ghost-sm" id="reconnectBtn">Reconnect</button>
  </div>
</div>

<!-- ── QR MODAL (share again) ───────────────────────────────────── -->
<div id="qrModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Share QR code">
  <div class="modal-card">
    <button class="modal-close" id="qrModalClose" aria-label="Close">✕</button>
    <p class="modal-title">Share this room</p>
    <div class="qr-box" id="qrBoxModal"></div>
    <p class="share-url" id="shareUrlModal"></p>
    <button class="btn-action" id="modalCopyBtn">Copy link</button>
  </div>
</div>

<script src="/public/app.js"></script>
</body>
</html>
