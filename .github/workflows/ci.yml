name: CI

on:
  pull_request:
    branches: [main]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          if ! echo "$BRANCH" | grep -qE '^(feat|feature|fix|chore)(\/[A-Z]+-[0-9]+-|\/[a-z0-9][a-z0-9-]*)'; then
            echo "Branch name '$BRANCH' does not match convention."
            echo "Expected: feat/STU-N-*, fix/STU-N-*, chore/STU-N-*, or feat/description"
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  clean-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after npm ci."
            git status
            exit 1
          fi
